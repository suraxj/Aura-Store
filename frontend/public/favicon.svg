<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="100" height="100" rx="28" fill="#090d16" />
  
  <!-- Outer Aura Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#auraGrad)" stroke-width="3" opacity="0.4" stroke-dasharray="8 6" />

  <!-- Interlocking Monogram Emblem "A" -->
  <path d="M 50 18 L 78 76 L 63 76 L 50 46 L 37 76 L 22 76 Z" fill="url(#auraGrad)" filter="url(#glow)" />
  <path d="M 33 60 L 67 60 L 60 70 L 40 70 Z" fill="#ffffff" opacity="0.95" />
  
  <!-- Sparkle Accent -->
  <path d="M 50 12 L 52 18 L 58 20 L 52 22 L 50 28 L 48 22 L 42 20 L 48 18 Z" fill="#fbbf24" />
</svg>
